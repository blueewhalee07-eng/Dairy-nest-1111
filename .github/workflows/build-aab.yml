name: Build Android Release AAB

  on:
  workflow_dispatch:
  :

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd Dairy-nest-1111
          npm install --legacy-peer-deps

      - name: Decode Keystore
        run: |
          cd Dairy-nest-1111/android/app
          echo "${{ secrets.MYAPP_UPLOAD_STORE_FILE_BASE64 }}" | base64 --decode > upload-keystore.jks

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > Dairy-nest-1111/android/local.properties

      - name: Build Android App Bundle (AAB)
        env:
          MYAPP_UPLOAD_STORE_FILE: upload-keystore.jks
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          cd Dairy-nest-1111/android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload Artifact (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: Dairy-nest-1111/android/app/build/outputs/bundle/release/app-release.aab
          
